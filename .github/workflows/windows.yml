# Builds the Windows download: a zip with the app's Python files, tinytag bundled, and
# "Lyrics Downloader.pyw" to double-click. No .exe: an unsigned .exe is blocked outright by
# Windows 11 Smart App Control, while Python itself is signed. Runs on every v* tag (and by hand
# with a tag name) and attaches the zip to that release.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4   # the tag on a push; the branch (main) when run by hand
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' lyrics_downloader.py)
          D="Lyrics Downloader"
          mkdir -p "pkg/$D"
          cp lyrics_downloader.py lyrics_downloader_gui.py "Lyrics Downloader.pyw" LICENSE "pkg/$D/"
          python -m pip install --target "pkg/$D" --no-deps tinytag
          rm -rf "pkg/$D"/bin "pkg/$D"/*.dist-info/RECORD
          cat > "pkg/$D/READ ME FIRST.txt" <<'TXT'
          Lyrics Downloader for Windows
          =============================

          1. Install Python 3 once, from https://www.python.org/downloads/
             (or in a terminal: winget install Python.Python.3.13).
          2. Double-click "Lyrics Downloader.pyw".

          Choose your music folder, tick Lyrics and/or Album covers, press Start.

          More: https://github.com/antongpopov/lyrics-downloader
          Bundled: tinytag (MIT licence, https://github.com/tinytag/tinytag).
          TXT
          sed -i 's/^          //' "pkg/$D/READ ME FIRST.txt"
          echo "ZIP=LyricsDownloader-$VERSION-windows.zip" >> "$GITHUB_ENV"
      - name: Smoke test (the bundled files load on Windows)
        shell: bash
        run: |
          cd "pkg/Lyrics Downloader"
          python -c "import lyrics_downloader as c, lyrics_downloader_gui; assert c.TinyTag is not None; print('ok', c.__version__)"
          python lyrics_downloader.py --version
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "pkg/Lyrics Downloader" -DestinationPath "$env:ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.ZIP }}
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ env.ZIP }}
