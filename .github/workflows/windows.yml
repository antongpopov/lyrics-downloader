# Builds LyricsDownloader.exe (Windows, one file, no console) on every v* tag and attaches it to
# that tag's GitHub release. The Mac builds are signed and notarized locally (scripts/build_mac.sh)
# so no signing keys ever live in this public repository.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install tinytag pyinstaller
      - name: Smoke test
        run: python lyrics_downloader.py --version
      - name: Build
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' lyrics_downloader.py)
          pyinstaller --noconfirm --onefile --windowed --name LyricsDownloader --icon assets/icon.ico lyrics_downloader_gui.py
          mv dist/LyricsDownloader.exe "dist/LyricsDownloader-$VERSION-windows.exe"
          echo "EXE=dist/LyricsDownloader-$VERSION-windows.exe" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.EXE }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE }}
